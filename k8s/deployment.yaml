apiVersion: apps/v1
kind: Deployment
metadata:
  name: yummops
  namespace: yummops-test
  labels:
    app: yummops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yummops
  template:
    metadata:
      labels:
        app: yummops
    spec:
      containers:
      - name: web # Force update to trigger GitOps reconciliation
        image: us-central1-docker.pkg.dev/agentic-harness-demo/demo/yummops:v1.2.2
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: REDIS_URL
          value: "redis://redis:6379"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
