apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yummops-ingress
  namespace: yummops-test
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: yummops
            port:
              number: 80
