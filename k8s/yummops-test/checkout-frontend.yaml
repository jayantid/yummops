apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-frontend
  namespace: yummops-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout-frontend
  template:
    metadata:
      labels:
        app: checkout-frontend
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-frontend
  namespace: yummops-test
spec:
  selector:
    app: checkout-frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
