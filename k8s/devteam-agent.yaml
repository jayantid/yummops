apiVersion: kubeagents.x-k8s.io/v1alpha1
kind: DevTeamAgent
metadata:
  name: devteam-agent-platform-agent-host-us-central1-yummops-test
  namespace: kubeagents-system
spec:
  harness:
    clusterName: "platform-agent-host"
    location: "us-central1"
    namespace: "yummops-test"
    hermes:
      apiServerSecretRef:
        name: "platform-agent-secrets"
        key: "API_SERVER_KEY"
  deployment:
    image: "ghcr.io/gke-labs/kube-agents/devteam-agent"
    tag: "latest"
  security:
    serviceAccountName: "kubeagents-devteam-agent"
    workloadIdentity:
      gcp:
        gsaName: "kubeagents-devteam-gsa"
        projectId: "jayantid-gkedemos"
