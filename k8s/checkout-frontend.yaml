apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-frontend
  namespace: yummops-test
  labels:
    app: checkout-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout-frontend
  template:
    metadata:
      labels:
        app: checkout-frontend
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-frontend
  namespace: yummops-test
spec:
  selector:
    app: checkout-frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP
