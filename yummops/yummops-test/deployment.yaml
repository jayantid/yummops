apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-frontend
  namespace: yummops-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-frontend
  template:
    metadata:
      labels:
        app: checkout-frontend
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
