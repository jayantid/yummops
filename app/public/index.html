<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YummOps - Live Food Rating</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent: #ff4757;
            --accent-glow: rgba(255, 71, 87, 0.4);
            --gradient-1: linear-gradient(135deg, #ff4757, #ff6b81);
            --gradient-2: linear-gradient(135deg, #2ed573, #7bed9f);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(to right, #ff4757, #ff6b81, #70a1ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
            padding: 1rem;
            animation: slideUp 0.8s ease-out;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 71, 87, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 71, 87, 0.1);
        }

        .emoji {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .card:hover .emoji {
            transform: scale(1.15) rotate(5deg);
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            text-transform: capitalize;
        }

        .votes-display {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-primary);
            margin: 1rem 0;
            transition: transform 0.2s ease;
        }

        .vote-btn {
            background: var(--gradient-1);
            border: none;
            color: white;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
            width: 100%;
        }

        .vote-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.6);
        }

        .vote-btn:active {
            transform: scale(0.98);
        }

        footer {
            margin-top: auto;
            padding-top: 3rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <header>
        <h1>YummOps v1.0</h1>
        <p class="subtitle">Autonomous Food Board • Powered by Dev Team Agent & GKE Autopilot</p>
    </header>

    <div class="grid">
        <div class="card" id="card-tacos">
            <span class="emoji">🌮</span>
            <h2>Tacos</h2>
            <div class="votes-display" id="votes-tacos">--</div>
            <button class="vote-btn" onclick="vote('tacos')">Upvote</button>
        </div>

        <div class="card" id="card-ramen">
            <span class="emoji">🍜</span>
            <h2>Ramen</h2>
            <div class="votes-display" id="votes-ramen">--</div>
            <button class="vote-btn" onclick="vote('ramen')">Upvote</button>
        </div>

        <div class="card" id="card-pizza">
            <span class="emoji">🍕</span>
            <h2>Pizza</h2>
            <div class="votes-display" id="votes-pizza">--</div>
            <button class="vote-btn" onclick="vote('pizza')">Upvote</button>
        </div>

        <div class="card" id="card-sushi">
            <span class="emoji">🍣</span>
            <h2>Sushi</h2>
            <div class="votes-display" id="votes-sushi">--</div>
            <button class="vote-btn" onclick="vote('sushi')">Upvote</button>
        </div>
    </div>

    <footer>
        <p>Live data synced to Redis • Self-healing configuration</p>
    </footer>

    <script>
        async function fetchVotes() {
            try {
                const res = await fetch('/api/votes');
                const data = await res.json();
                for (const [item, count] of Object.entries(data)) {
                    const el = document.getElementById(`votes-${item}`);
                    if (el) el.textContent = count;
                }
            } catch (err) {
                console.error('Error fetching votes:', err);
            }
        }

        async function vote(item) {
            try {
                const res = await fetch(`/api/vote/${item}`, { method: 'POST' });
                const data = await res.json();
                if (data.count !== undefined) {
                    const el = document.getElementById(`votes-${item}`);
                    if (el) {
                        el.textContent = data.count;
                        el.style.transform = 'scale(1.2)';
                        setTimeout(() => el.style.transform = 'scale(1)', 200);
                    }
                }
            } catch (err) {
                console.error('Error voting:', err);
            }
        }

        // Poll every 3 seconds for live upvotes
        fetchVotes();
        setInterval(fetchVotes, 3000);
    </script>
</body>
</html>
